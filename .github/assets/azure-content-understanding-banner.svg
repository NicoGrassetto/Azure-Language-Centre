  <title id="banner-title">Azure Content Understanding</title>
  <desc id="banner-description">Azure Content Understanding. Repository series. White Geist Pixel Square lettering and JetBrains Mono details on a black, subtly scanlined background, with the dedicated Azure Content Understanding icon published in the Microsoft Foundry Tools product catalog. Original icon colors and proportions are preserved. All lettering is outlined; no fonts or external resources are required.</desc>
